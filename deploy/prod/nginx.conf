# nginx do Revoada — serve o SPA + arquivos do agente e faz proxy interno.
# Exposto ao mundo só pelo Traefik (HTTPS em revoada.exemplo.com.br).

limit_req_zone $binary_remote_addr zone=ingest:10m rate=100r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 16m;          # alinhado ao LimitReader de 16MiB do gateway
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Segurança de transporte. Herdados por `location /` (o documento HTML), que é a
    # resposta cujo estado o navegador mostra na barra de endereço.
    # - HSTS: navegador passa a usar HTTPS sempre neste host — impede o "Não seguro"
    #   por downgrade/http e o cert self-signed transitório do Traefik antes do LE.
    #   Sem includeSubDomains/preload para não afetar outros subdomínios de exemplo.com.br.
    # - upgrade-insecure-requests: sobe automaticamente qualquer sub-recurso http para
    #   https, eliminando "conteúdo misto" (a causa clássica de "Não seguro" com cert válido).
    add_header Strict-Transport-Security "max-age=15768000" always;
    # CSP: além do upgrade-insecure-requests, restringe as origens e — o principal —
    # `frame-ancestors 'none'` (anti-clickjacking; o painel nunca é embutido em iframe)
    # e `object-src 'none'`/`base-uri 'self'`. Scripts/estilos precisam de
    # 'unsafe-inline' (o Vite injeta estilo inline e há o script de tema no index);
    # o app não usa innerHTML/eval, então a superfície residual é baixa. connect-src
    # inclui ws/wss para o tail de logs ao vivo.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # DNS embutido do Docker (127.0.0.11). Com o proxy_pass usando VARIÁVEL, o nginx
    # re-resolve o IP dos upstreams em runtime — sobrevive a reboot/recriação dos
    # containers (senão o nginx cacheia o IP no boot e dá 502 quando o IP muda).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Expurgo de logs (LGPD) — SEM log de acesso.
    #
    # O `body_like` de um expurgo É o dado vazado: o CPF, o token ou a senha que caiu
    # no log e precisa sair. O nginx registra `$request` inteiro (método + URI) em
    # stdout, o agente coleta o stdout deste container e o devolve para dentro da
    # tabela `logs` — a MESMA que o operador está tentando limpar. Caçar o vazamento
    # recriava o vazamento, e o redator do agente não mascara `body_like`.
    #
    # O preview passou a ser POST com o recorte no CORPO (o nginx não registra corpo),
    # e esta location é a segunda camada: mesmo que alguém volte a mandar parâmetro na
    # URL, não fica rastro aqui. Location por REGEX, que tem prioridade sobre o prefixo
    # `location /api/` — por isso a configuração de proxy precisa ser repetida.
    location ~ ^/api/logs/purge {
        access_log off;
        set $revoada_server_purge server;
        proxy_pass http://$revoada_server_purge:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # API interna do painel (JWT no server).
    location /api/ {
        set $revoada_server server;
        proxy_pass http://$revoada_server:8091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # WebSocket (/api/live, /api/logs/tail)
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # Ingestão pública (autenticada por X-Revoada-Key no gateway). Rate limit de borda.
    location /v1/ {
        limit_req zone=ingest burst=200 nodelay;
        set $revoada_gateway gateway;
        proxy_pass http://$revoada_gateway:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /ingest/ {
        limit_req zone=ingest burst=200 nodelay;
        set $revoada_gateway gateway;
        proxy_pass http://$revoada_gateway:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /probe/ {
        set $revoada_gateway gateway;
        proxy_pass http://$revoada_gateway:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Fontes self-hosted e assets com hash: cache longo.
    location /fonts/   { root /usr/share/nginx/html; expires 30d; add_header Cache-Control "public, immutable"; }
    location /assets/  { root /usr/share/nginx/html; expires 30d; add_header Cache-Control "public, immutable"; }

    # ── Artefatos do agente: rotas EXATAS, SEM fallback de SPA ────────────────────
    # Bug histórico: com o `try_files ... /index.html` do `location /`, um binário
    # AUSENTE no dist fazia o nginx responder 200 com o HTML do index. O `curl -f`
    # do install.sh "sucedia" baixando HTML, o chmod passava, e o agente nunca subia
    # (a falha migrava, silenciosa, pro passo do serviço). Estas locations `= ` (match
    # exato, prioridade máxima) usam `try_files $uri =404;`: se o arquivo não existir,
    # devolvem 404 DE VERDADE — nunca o index.html. Assim o install.sh consegue
    # distinguir "binário indisponível" (retry) de "binário ok".
    location = /revoada-agent {
        root /usr/share/nginx/html;
        default_type application/octet-stream;   # binário ELF, não deixa o nginx adivinhar text/html
        try_files $uri =404;
    }
    location = /revoada-agent.exe {
        root /usr/share/nginx/html;
        default_type application/octet-stream;
        try_files $uri =404;
    }
    location = /install.sh {
        root /usr/share/nginx/html;
        default_type text/x-shellscript;         # script de texto, sem cair no SPA
        try_files $uri =404;
    }

    # SPA (React, hash router). Demais artefatos do agente na raiz caem aqui só se
    # NÃO casarem uma das rotas exatas acima.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
