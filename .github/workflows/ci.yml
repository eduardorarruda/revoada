name: CI

# Matriz Linux/Windows/macOS (ARQUITETURA §4): build + testes Go nos três sistemas,
# compilação cruzada amd64/arm64 do painel e do agente, lint, testes web e
# checagem de vulnerabilidades (govulncheck, npm audit, gitleaks).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'
  GO_MODULES: core agent gateway server

jobs:
  test-go:
    name: go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.sum'
      - name: vet + test
        run: |
          fail=0
          for m in $GO_MODULES; do
            [ -f "$m/go.mod" ] || continue
            echo "::group::$m"
            log="$RUNNER_TEMP/teste-$m.log"
            (cd "$m" && go vet ./... && go test -race -count=1 ./...) > "$log" 2>&1
            rc=$?
            cat "$log"
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then
              fail=1
              # As linhas da falha viram anotações: aparecem no resumo do run sem
              # precisar abrir (nem ter acesso a) o log inteiro.
              grep -E -- '^(--- FAIL|FAIL|panic:|# )|_test\.go:[0-9]+:|\.go:[0-9]+:[0-9]+:' "$log" | head -25 |
                while IFS= read -r l; do echo "::error title=go test ($m)::$l"; done
            fi
          done
          exit $fail

  cross-build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.sum'
      - name: build (CGO desligado — binário único, sem dependências)
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          for m in $GO_MODULES; do
            [ -f "$m/go.mod" ] || continue
            (cd "$m" && go build ./...)
          done

  desktop:
    # App desktop (Wails) — módulo fora do go.work: precisa de CGO e das bibliotecas
    # de interface do sistema, e não pode quebrar a matriz dos outros módulos.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: desktop/go.sum
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - working-directory: desktop
        env: { GOWORK: "off" }
        run: |
          go vet -tags desktop,production,webkit2_41 .
          go test -tags desktop,production,webkit2_41 ./...
          go build -tags desktop,production,webkit2_41 -trimpath -o revoada-desktop .

  lint-go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [core, agent, gateway, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint (${{ matrix.module }})
        if: hashFiles(format('{0}/go.mod', matrix.module)) != ''
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: ${{ matrix.module }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck (Go modules)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          fail=0
          for m in $GO_MODULES; do
            [ -f "$m/go.mod" ] || continue
            (cd "$m" && govulncheck ./...) || fail=1
          done
          exit $fail
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm audit (dependências de produção)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: gitleaks (segredos no histórico)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
