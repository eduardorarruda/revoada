# Atualizações semanais agrupadas: um PR por ecossistema (e não um por pacote),
# para a fila de revisão não virar ruído.
version: 2
updates:
  - package-ecosystem: gomod
    directories: [/core, /proto, /server, /gateway, /agent, /desktop]
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: [/, /server, /gateway]
    schedule: { interval: weekly }
    groups:
      docker: { patterns: ["*"] }
