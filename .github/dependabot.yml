# Atualizações semanais agrupadas: um PR por ecossistema (e não um por pacote),
# para a fila de revisão não virar ruído.
version: 2
updates:
  - package-ecosystem: gomod
    directories: [/core, /proto, /server, /gateway, /agent, /desktop]
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ["*"] }
    ignore:
      # typescript-eslint 8 só aceita TypeScript abaixo de 6.1 (peer): o 7 trava o
      # `npm ci`. Liberar quando o typescript-eslint suportar o TypeScript 7.
      - dependency-name: typescript
        versions: [">=6.1"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: [/, /server, /gateway]
    schedule: { interval: weekly }
    groups:
      docker: { patterns: ["*"] }
