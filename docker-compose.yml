# Revoada — início rápido. Sobe o stack inteiro numa máquina com Docker:
#
#   ./scripts/iniciar.sh          # gera o .env com segredos aleatórios e sobe tudo
#   (ou: cp .env.example .env, preencha, e `docker compose up -d --build`)
#
# Painel (interface + API + MCP): http://localhost:${REVOADA_PORTA:-8080}
# Agentes enviam métricas/logs ao gateway (porta 8090) e abrem o canal mTLS no 7443.
#
# Em produção, ponha um proxy com HTTPS na frente do painel (Caddy, Traefik, nginx)
# e defina REVOADA_SECURE_COOKIES=1 no .env.
name: revoada

x-log: &log
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

volumes:
  dados: {}
  clickhouse: {}
  postgres: {}
  nats: {}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *log
    environment:
      POSTGRES_DB: revoada
      POSTGRES_USER: revoada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env (rode ./scripts/iniciar.sh)}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revoada -d revoada"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    logging: *log
    environment:
      CLICKHOUSE_DB: revoada
      CLICKHOUSE_USER: revoada
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?defina no .env (rode ./scripts/iniciar.sh)}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse:/var/lib/clickhouse
      # retenção curta dos logs internos do ClickHouse (system.*_log)
      - ./deploy/prod/clickhouse/config.d/system-logs-ttl.xml:/etc/clickhouse-server/config.d/system-logs-ttl.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    logging: *log
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    volumes: [nats:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # cria/atualiza as tabelas de telemetria no ClickHouse e termina
  migrate:
    image: revoada-gateway:local
    build: { context: ., dockerfile: gateway/Dockerfile }
    restart: "no"
    logging: *log
    entrypoint: ["/migrate", "-dir", "/deploy/migrations/clickhouse"]
    environment: &ch
      REVOADA_CH_ADDR: http://clickhouse:8123
      REVOADA_CH_USER: revoada
      REVOADA_CH_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REVOADA_CH_DB: revoada
    depends_on:
      clickhouse: { condition: service_healthy }

  # ingestão: OTLP (HTTP 8090, gRPC 4317) dos agentes e de qualquer app instrumentada
  gateway:
    image: revoada-gateway:local
    build: { context: ., dockerfile: gateway/Dockerfile }
    restart: unless-stopped
    logging: *log
    environment:
      <<: *ch
      REVOADA_HTTP_ADDR: ":8090"
      REVOADA_OTLP_GRPC_ADDR: ":4317"
      REVOADA_PG_DSN: postgres://revoada:${POSTGRES_PASSWORD}@postgres:5432/revoada?sslmode=disable
      REVOADA_NATS_URL: nats://nats:4222
      REVOADA_NATS_MON_URL: http://nats:8222/healthz
    ports:
      - "${REVOADA_PORTA_GATEWAY:-8090}:8090"
      - "${REVOADA_PORTA_OTLP_GRPC:-4317}:4317"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # painel: interface + API + MCP + canal dos agentes (binário único)
  painel:
    image: revoada-painel:local
    build: { context: ., dockerfile: Dockerfile }
    restart: unless-stopped
    logging: *log
    environment:
      <<: *ch
      REVOADA_ENV: ${REVOADA_ENV:-production}
      REVOADA_JWT_SECRET: ${REVOADA_JWT_SECRET:?defina no .env (rode ./scripts/iniciar.sh)}
      REVOADA_SECURE_COOKIES: ${REVOADA_SECURE_COOKIES:-0}
      REVOADA_PUBLIC_URL: ${REVOADA_PUBLIC_URL:-http://localhost:8080}
      REVOADA_GATEWAY_PUBLIC_URL: ${REVOADA_GATEWAY_PUBLIC_URL:-http://localhost:8090}
      REVOADA_PG_DSN: postgres://revoada:${POSTGRES_PASSWORD}@postgres:5432/revoada?sslmode=disable
      REVOADA_CANAL_HOSTS: ${REVOADA_CANAL_HOSTS:-localhost,127.0.0.1}
      REVOADA_CANAL_PUBLICO: ${REVOADA_CANAL_PUBLICO:-localhost:7443}
      REVOADA_RETENTION_DAYS: ${REVOADA_RETENTION_DAYS:-120}
    volumes: [dados:/var/lib/revoada]
    ports:
      - "${REVOADA_PORTA:-8080}:8091"
      - "${REVOADA_PORTA_CANAL:-7443}:7443"
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
